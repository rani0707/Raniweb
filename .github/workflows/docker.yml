name: Build, scan and sign release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify linux/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Deployment policy regression tests
        run: python3 -m unittest discover -s deployment/tests -v
      - name: Source dependency and secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          skip-dirs: audit-results,node_modules,.next,test-results,playwright-report
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Read approved gateway digest
        run: python3 -c 'import json,os; value=json.load(open("deployment/tools.lock.json"))["gateway"]["image"]; open(os.environ["GITHUB_ENV"],"a").write("RANIWEB_GATEWAY_IMAGE="+value+"\n")'
      - name: Block vulnerable gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          version: v0.76.1
          image-ref: ${{ env.RANIWEB_GATEWAY_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and run application checks inside build stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: raniweb:check-${{ matrix.arch }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Block vulnerable runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: raniweb:check-${{ matrix.arch }}-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Generate platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: raniweb:check-${{ matrix.arch }}-${{ github.sha }}
          format: spdx-json
          output: sbom-${{ matrix.arch }}.json
      - name: Read-only runtime smoke test
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name raniweb-smoke --platform "linux/$ARCH" --read-only --tmpfs /tmp:rw,nosuid,noexec,size=64m --cap-drop ALL --security-opt no-new-privileges --memory 512m --pids-limit 128 -p 127.0.0.1:3000:3000 "raniweb:check-$ARCH-$SOURCE_SHA"
          trap 'docker logs raniweb-smoke; docker rm -f raniweb-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --max-time 3 -fsS http://127.0.0.1:3000/api/health; then
              node scripts/smoke-test.mjs http://127.0.0.1:3000
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Save exactly the tested image
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ github.sha }}
        run: docker save --output "image-$ARCH.tar" "raniweb:check-$ARCH-$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-image-${{ matrix.arch }}
          path: |
            image-${{ matrix.arch }}.tar
            sbom-${{ matrix.arch }}.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checked-image-*
          merge-multiple: true
          path: checked-images
      - name: Install checksum-pinned signing tools
        run: |
          python3 deployment/install_tools.py --destination "$RUNNER_TEMP/rani-tools"
          echo "$RUNNER_TEMP/rani-tools" >> "$GITHUB_PATH"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish, attest, sign, verify, then promote stable
        run: python3 deployment/publish.py --artifacts checked-images
